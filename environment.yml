# Conda environment for Daedalus — the MSRJD Field Theory Framework.
#
#   conda env create -f environment.yml      # or:  mamba env create -f environment.yml
#   conda activate daedalus
#
# SageMath brings Python (pinned to 3.12 below) and most of the stack (numpy, scipy, sympy, matplotlib,
# networkx, cysignals, the Jupyter stack incl. ipywidgets, and a SageMath kernel).
# The remaining lines are the only extras Daedalus adds on top.
name: daedalus
channels:
  - conda-forge
dependencies:
  - sage=10.8
  # Pin the scientific stack to the exact versions CI runs and the suite is tested against
  # (audit W5 / TST-07: ranges let a new conda-forge release change CI's stack between two runs,
  # and the test tolerances are confirmed per stack).  Left unpinned, conda-forge resolves the
  # bleeding edge (numpy 2.4 / scipy 1.18 / sympy 1.14 / py3.14), which removed np.trapz, made
  # float(size-1 array) a hard error, and shifts the symbolic mean-field solve onto spurious
  # saddles -- 105 CI failures (see git history).  Supported ranges, if you must relax a pin:
  # python <3.14, numpy <2.4, scipy <1.18, sympy <1.14, numba >=0.61,<0.66.
  - python=3.12
  - numpy=2.3.5
  - scipy=1.17.1
  - sympy=1.13.3
  - numba=0.65.1         # loop-integrator speed; required by the sim cells in notebooks/examples/
  - pydot>=4,<5          # optional: diagram / prediagram plots
  - graphviz             # optional: renders pydot output
  - pytest               # test runner (used by the CI workflow)
  # - pyperclip          # optional: clipboard buttons in the graphical model builder
