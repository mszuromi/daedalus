name: slow-tests

# The tests marked `slow` (pytest.ini deselects them from the default suite and from tests.yml):
# weekly and on demand, in three shards (test files dealt round-robin, so a shard is a fixed set
# of whole files).  The `bigmem` test (> 12 GB footprint) runs only when asked, in a job of
# their own (a standard runner has 16 GB). Same cached conda environment as tests.yml.
on:
  workflow_dispatch:
    inputs:
      bigmem:
        description: 'Also run the bigmem tests (> 12 GB footprint)'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '41 4 * * 0'     # Sundays 04:41 UTC

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    defaults:
      run:
        shell: bash -el {0}
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4

      - name: Set up SageMath 10.9 + extras (conda)
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Select this shard's files
        run: |
          python -m pytest tests/ -q --collect-only -m "slow and not bigmem" 2>/dev/null \
            | grep '::' | cut -d: -f1 | sort -u > all_slow_files.txt
          awk -v k=${{ matrix.shard }} '(NR - 1) % 3 == k' all_slow_files.txt > shard.txt
          echo "shard ${{ matrix.shard }}: $(wc -l < shard.txt) of $(wc -l < all_slow_files.txt) files"
          cat shard.txt

      - name: Run the slow tests of this shard
        run: |
          if [ ! -s shard.txt ]; then echo 'empty shard'; exit 0; fi
          python -m pytest -q -m "slow and not bigmem" --durations=25 $(cat shard.txt)

  bigmem:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.bigmem }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        shell: bash -el {0}
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4

      - name: Set up SageMath 10.9 + extras (conda)
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Run the bigmem tests (one at a time)
        run: python -m pytest tests/ -q -m bigmem --durations=0
