name: tests

# Runs the test suite under a real SageMath install. The conda SageMath package is large, so
# the environment is cached; the first run (and any environment.yml change) is slow (~20-40 min),
# cached runs are quick. pytest.ini deselects the minutes-long tests by default.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}        # login shell so the conda env is active
    steps:
      - uses: actions/checkout@v4

      - name: Set up SageMath 10.9 + extras (conda)
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Show the resolved stack
        run: |
          python -c "import sys, numpy, scipy, sympy, numba, mpmath; print('python', sys.version.split()[0], '| numpy', numpy.__version__, '| scipy', scipy.__version__, '| sympy', sympy.__version__, '| numba', numba.__version__, '| mpmath', mpmath.__version__)"
          python -c "import sage.version; print('sage', sage.version.version)"
          python -c "import daedalus.engine.enumeration.fastenum as f; print('compiled enumeration:', f.available, f.cert_backend or f.reason)"

      - name: Run the test suite (slow tests deselected via pytest.ini)
        run: python -m pytest tests/ -q     # the activated conda env's python already has Sage
